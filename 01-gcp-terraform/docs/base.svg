<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<filter id="sh" x="-10%" y="-10%" width="125%" height="135%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<marker id="arblue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/></marker>
<marker id="argreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22a05a"/></marker>
<marker id="arpurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
<marker id="arorange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
<marker id="argray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1700" height="930" fill="#f4f6fa"/>
<text x="40" y="58" font-size="30" font-weight="800" fill="#0f172a" text-anchor="start" >Base version: only what the brief asks</text>
<text x="40" y="88" font-size="15.5" font-weight="400" fill="#475569" text-anchor="start" >A VPC with a public and a private subnet, one Compute Engine instance, a global HTTP load balancer and three firewall requirements.</text>
<text x="1180" y="46" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start" >Enforced by</text>
<rect x="1180.0" y="61" width="117.0" height="26" rx="13" fill="#dbe8ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="1238.5" y="79" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" >Load balancer</text>
<rect x="1311.0" y="61" width="145.0" height="26" rx="13" fill="#d9f2e3" stroke="#22a05a" stroke-width="1.2"/>
<text x="1383.5" y="79" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle" >VPC firewall rule</text>
<rect x="40" y="250" width="170" height="96" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/>
<text x="125" y="288" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" >Visitors</text>
<text x="125" y="312" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" >browser or curl</text>
<text x="125" y="330" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" >from the internet</text>
<rect x="40" y="560" width="170" height="120" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/>
<text x="125" y="600" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle" >Admin</text>
<text x="125" y="624" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" >on a trusted</text>
<text x="125" y="642" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle" >IP range</text>
<text x="125" y="662" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" >(trusted_ssh_cidrs)</text>
<rect x="300" y="140" width="350" height="360" rx="18" fill="#eaf1ff" stroke="#5b8def" stroke-width="2"/>
<text x="322" y="170" font-size="16" font-weight="800" fill="#1e3a8a" text-anchor="start" >Google edge, outside the VPC</text>
<text x="322" y="190" font-size="13" font-weight="400" fill="#3b5aa8" text-anchor="start" >Global HTTP load balancer (HTTPS on 443)</text>
<rect x="318" y="206" width="314" height="78" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#sh)"/>
<rect x="318" y="206" width="6" height="78" rx="3" fill="#3b82f6"/>
<text x="336" y="232" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Forwarding rule</text>
<text x="336" y="254" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >tcp/443 only, no port-80 listener</text>
<text x="336" y="272" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >static global IP address</text>
<rect x="318" y="294" width="314" height="78" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#sh)"/>
<rect x="318" y="294" width="6" height="78" rx="3" fill="#3b82f6"/>
<text x="336" y="320" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" >HTTPS proxy and certificate</text>
<text x="336" y="342" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >Google-managed for your domains, or a</text>
<text x="336" y="360" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >certificate you supply (no key in state)</text>
<rect x="318" y="382" width="314" height="78" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6" filter="url(#sh)"/>
<rect x="318" y="382" width="6" height="78" rx="3" fill="#3b82f6"/>
<text x="336" y="408" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >URL map, backend service</text>
<text x="336" y="430" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >routes to the instance group</text>
<text x="336" y="448" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >health check on port 80</text>
<text x="322" y="530" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" >A global load balancer is a Google edge service,</text>
<text x="322" y="548" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" >so it cannot sit in the public subnet or any other.</text>
<rect x="700" y="120" width="810" height="540" rx="20" fill="#ffffff" stroke="#475569" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="722" y="150" font-size="17" font-weight="800" fill="#0f172a" text-anchor="start" >Custom VPC</text>
<text x="842" y="150" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" >custom mode, no default subnets</text>
<rect x="728" y="172" width="754" height="262" rx="16" fill="#effaf3" stroke="#22a05a" stroke-width="2"/>
<text x="748" y="200" font-size="15" font-weight="800" fill="#14532d" text-anchor="start" >Private subnet 10.10.1.0/24</text>
<rect x="748" y="214" width="336" height="200" rx="12" fill="#ffffff" stroke="#22a05a" stroke-width="1.6" filter="url(#sh)"/>
<rect x="748" y="214" width="6" height="200" rx="3" fill="#22a05a"/>
<text x="766" y="240" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Compute Engine instance</text>
<text x="766" y="262" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >e2-small, Debian 13, no external IP</text>
<text x="766" y="280" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >dedicated service account, never the default</text>
<text x="766" y="298" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >roles: logWriter, metricWriter only</text>
<text x="766" y="316" font-size="13" font-weight="400" fill="#334155" text-anchor="start" >serves a test page on port 80</text>
<rect x="1108" y="212" width="350" height="196" rx="12" fill="#ffffff" stroke="#22a05a" stroke-width="1.6" filter="url(#sh)"/>
<rect x="1108" y="212" width="6" height="196" rx="3" fill="#22a05a"/>
<text x="1126" y="238" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" >Firewall rules on the instance</text>
<text x="1126" y="258" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" >(target is its service account, not a network tag)</text>
<text x="1126" y="284" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >allow tcp/80 from 130.211.0.0/22 and</text>
<text x="1126" y="302" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >     35.191.0.0/16 (the load balancer)</text>
<text x="1126" y="320" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >allow tcp/22 from trusted_ssh_cidrs</text>
<text x="1126" y="338" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >     (never 0.0.0.0/0)</text>
<text x="1126" y="356" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >no rule for 443: a firewall cannot see a</text>
<text x="1126" y="374" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >global load balancer, the forwarding rule</text>
<text x="1126" y="392" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start" >listens on 443 only</text>
<rect x="728" y="486" width="754" height="150" rx="16" fill="#fafafa" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="748" y="514" font-size="15" font-weight="800" fill="#334155" text-anchor="start" >Public subnet 10.10.0.0/24</text>
<text x="748" y="544" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" >No resources. The brief asks for a public subnet, so it exists.</text>
<text x="748" y="564" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" >The load balancer is not placed here because a global load balancer</text>
<text x="748" y="584" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" >cannot be placed in a subnet. The extended version puts a bastion here.</text>
<path d="M210,298 L298,298" fill="none" stroke="#3b82f6" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#arblue)"/>
<rect x="209.5" y="257" width="89.0" height="26" rx="13" fill="#dbe8ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="254" y="275" font-size="12.5" font-weight="700" fill="#1d4ed8" text-anchor="middle" >HTTPS 443</text>
<path d="M632,423 L714,423 L714,330 L746,330" fill="none" stroke="#22a05a" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#argreen)"/>
<rect x="628.5" y="387" width="75.0" height="26" rx="13" fill="#d9f2e3" stroke="#22a05a" stroke-width="1.2"/>
<text x="666" y="405" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle" >HTTP 80</text>
<path d="M210,620 L696,620" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arorange)"/>
<rect x="288.5" y="633" width="327.0" height="26" rx="13" fill="#ffe8cf" stroke="#f59e0b" stroke-width="1.2"/>
<text x="452" y="651" font-size="12.5" font-weight="700" fill="#9a3412" text-anchor="middle" >SSH 22 needs a private route (VPN, peering)</text>
<rect x="40" y="712" width="540" height="176" rx="12" fill="#ffffff" stroke="#22a05a" stroke-width="1.6" filter="url(#sh)"/>
<rect x="40" y="712" width="6" height="176" rx="3" fill="#22a05a"/>
<text x="58" y="738" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Brief, requirement by requirement</text>
<text x="58" y="760" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >VPC, public and private subnet: network.tf</text>
<text x="58" y="781" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >Instance in the private subnet: compute.tf</text>
<text x="58" y="802" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >Global HTTP load balancer: loadbalancer.tf</text>
<text x="58" y="823" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >443, 22, 80 rules: loadbalancer.tf, firewall.tf</text>
<text x="58" y="844" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >Bonus, least-privilege IAM: iam.tf</text>
<rect x="610" y="712" width="500" height="176" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/>
<rect x="610" y="712" width="6" height="176" rx="3" fill="#94a3b8"/>
<text x="628" y="738" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Left out on purpose</text>
<text x="628" y="760" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >The extended version adds, each one labelled:</text>
<text x="628" y="781" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >outbound internet (Cloud NAT), an SSH bastion,</text>
<text x="628" y="802" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >Cloud Armor, a TLS policy, Shielded VM and OS Login,</text>
<text x="628" y="823" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >deny-all and egress rules, and all logging.</text>
<rect x="1140" y="712" width="520" height="176" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6" filter="url(#sh)"/>
<rect x="1140" y="712" width="6" height="176" rx="3" fill="#94a3b8"/>
<text x="1158" y="738" font-size="16" font-weight="700" fill="#0f172a" text-anchor="start" >Checked offline and live</text>
<text x="1158" y="760" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >34 terraform tests, 31 Checkov checks, 7 skips</text>
<text x="1158" y="781" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >(the items left out)</text>
<text x="1158" y="802" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >Live apply and destroy on 2026-10-14: HTTPS 200,</text>
<text x="1158" y="823" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >port 80 unanswered, no external IP, two allow rules</text>
<text x="1158" y="844" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" >Not tested: SSH (no route), managed certificate</text>
</svg>