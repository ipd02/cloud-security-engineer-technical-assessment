<rect width="1700" height="830" fill="#f4f6fa"/>
<text x="40" y="58" font-size="32" font-weight="800" fill="#0f172a" text-anchor="start">Base version</text>
<text x="40" y="88" font-size="15.5" font-weight="400" fill="#475569" text-anchor="start">The complete solution to the brief.</text>
<text x="1210" y="46" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="start">Enforced by</text>
