metadata:
  id: "CKV2_CUSTOM_GCP_3"
  name: "Ensure no ingress allow rule takes traffic from 0.0.0.0/0 or ::/0"
  category: "NETWORKING"
definition:
  or:
    - cond_type: "attribute"
      resource_types:
        - "google_compute_firewall"
      attribute: "allow"
      operator: "not_exists"
    - cond_type: "attribute"
      resource_types:
        - "google_compute_firewall"
      attribute: "direction"
      operator: "equals"
      value: "EGRESS"
    - and:
        - cond_type: "attribute"
          resource_types:
            - "google_compute_firewall"
          attribute: "source_ranges"
          operator: "not_contains"
          value: "0.0.0.0/0"
        - cond_type: "attribute"
          resource_types:
            - "google_compute_firewall"
          attribute: "source_ranges"
          operator: "not_contains"
          value: "::/0"
