name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: secrets (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "${base}/${tgz}" -o "${tgz}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " ${tgz}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tgz}" gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks detect --config .gitleaks.toml --redact --verbose

  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install checkov
        run: pip install checkov==3.3.20
      - name: Init plugins
        run: tflint --init
      - name: Lint, test and scan
        run: make tf-lint tf-test tf-scan

  cloud-check:
    name: cloud-check (cfn-lint, checkov, hadolint, trivy config, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          02-cloud-security-check/scripts/ci-install-tools.sh python hadolint trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint the hardened files
        run: make cloud-check-lint
      - name: Scan the hardened files
        run: make cloud-check-scan
      - name: Originals must fail, hardened must pass
        run: make cloud-check-test
      - name: Unit tests for the IAM finder
        run: make cloud-check-unit

  cloud-check-image:
    name: cloud-check-image (build, run, trivy image)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy
        run: |
          02-cloud-security-check/scripts/ci-install-tools.sh trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the hardened image
        run: make cloud-check-build
      - name: Run with the recommended flags until healthy
        run: |
          docker run -d --name cloud-check --read-only --cap-drop=ALL \
            --security-opt no-new-privileges -p 8080:8080 cloud-check-hardened:local
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' cloud-check)"
            echo "health: ${status}"
            [ "${status}" = healthy ] && break
            sleep 2
          done
          [ "${status}" = healthy ]
          curl -sSf http://127.0.0.1:8080/healthz
      - name: Image findings, all HIGH and CRITICAL (report only)
        run: trivy image --severity HIGH,CRITICAL --exit-code 0 cloud-check-hardened:local
      - name: Image findings with a fix available (gate)
        # Debian lists no fixed version for the remaining HIGH findings in the
        # base image, so the gate ignores unfixed ones. The step above shows
        # them. A rebuild on a newer base digest is how they get fixed.
        run: trivy image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 cloud-check-hardened:local
      - name: Remove the container
        if: always()
        run: docker rm -f cloud-check

  dependency-audit:
    name: dependency audit (ruff, tests, trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUFF_VERSION: 0.17.0
      TRIVY_VERSION: 0.75.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ruff
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet "ruff==${RUFF_VERSION}"
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"
      - name: Install trivy
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "${base}/${archive}" -o "${archive}"
          curl -sSfL "${base}/trivy_${TRIVY_VERSION}_checksums.txt" -o checksums.txt
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/bin" trivy
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
      - name: Lint
        run: make dep-audit-lint
      - name: Unit tests
        run: make dep-audit-test
      # fixed/ must have no HIGH or CRITICAL finding, and vulnerable-input/ must still be caught.
      - name: Scan
        run: make dep-audit-scan

  firewall-scanner:
    name: firewall-scanner (golangci-lint, go test -race, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 03-firewall-scanner/go.mod
          cache-dependency-path: 03-firewall-scanner/go.sum
      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make fwscan-lint
      - name: Test with the race detector
        run: make fwscan-test
      - name: Build
        run: make fwscan-build

  summary:
    name: summary
    if: always()
    needs: [secrets, terraform, cloud-check, cloud-check-image, dependency-audit, firewall-scanner]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq 'failure|cancelled'; then exit 1; fi
